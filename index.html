<style>
:root{
  --bg:#0b1220; --bg2:#0f1729; --card:#131d33; --card-border:#22304d;
  --text:#e8edf7; --text-dim:#93a3c0; --accent:#4f7cff; --accent2:#7aa2ff;
  --success:#3ddc97; --danger:#ff6b6b; --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f5f7fb; --bg2:#ffffff; --card:#ffffff; --card-border:#e3e8f2;
  --text:#141b2e; --text-dim:#5b6784; --accent:#3660ff; --accent2:#2148d6;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100%; transition:background .2s,color .2s;}
a{color:inherit; text-decoration:none;}
button,input,select,textarea{font-family:inherit; color:inherit;}
.container{max-width:1180px; margin:0 auto; padding:0 20px;}
header{position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--card-border); padding-top:env(safe-area-inset-top,0px);}
.nav{display:flex; align-items:center; justify-content:space-between; height:64px;}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.25rem;}
.logo-mark{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;}
.logo-mark img{width:34px; height:34px; border-radius:9px; position:relative; z-index:1;}
.logo-ring{position:absolute; inset:-4px; border-radius:12px; border:2px solid var(--accent); opacity:0; animation:logoPulse 2.8s ease-out infinite;}
@keyframes logoPulse{0%{transform:scale(.85); opacity:.7;} 70%{transform:scale(1.35); opacity:0;} 100%{opacity:0;}}
.nav-links{display:flex; gap:26px; align-items:center;}
.nav-links a{color:var(--text-dim); font-weight:500; font-size:.95rem;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.nav-right{display:flex; align-items:center; gap:10px;}
.icon-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--card-border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem;}
.hamburger{display:none;}
@media (max-width:820px){
  .nav-links{position:fixed; top:64px; left:0; right:0; background:var(--bg2); border-bottom:1px solid var(--card-border); flex-direction:column; padding:16px 20px; gap:14px; display:none;}
  .nav-links.open{display:flex;}
  .hamburger{display:flex;}
}
main{min-height:70vh; padding:36px 0 80px;}
.hero{text-align:center; padding:50px 0 30px;}
.hero h1{font-size:clamp(1.8rem,4.5vw,3rem); font-weight:800; line-height:1.15; margin-bottom:14px;}
.hero p{color:var(--text-dim); font-size:1.05rem; max-width:560px; margin:0 auto 26px;}
.search-bar{max-width:520px; margin:0 auto; position:relative;}
.search-bar input{width:100%; padding:14px 18px; border-radius:999px; border:1px solid var(--card-border); background:var(--card); font-size:.95rem;}
.search-bar input:focus{outline:2px solid var(--accent); outline-offset:2px;}
h2.section-title{font-size:1.4rem; font-weight:700; margin:44px 0 18px;}
.cat-grid,.tool-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:18px; cursor:pointer; transition:transform .12s,border-color .12s;}
.card:hover{transform:translateY(-2px); border-color:var(--accent);}
.card .emoji{font-size:1.5rem; margin-bottom:8px; display:block;}
.card h3{font-size:1rem; font-weight:600; margin-bottom:4px;}
.card p{font-size:.85rem; color:var(--text-dim);}
.why-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:44px;}
.why-grid .card{text-align:center; cursor:default;}
.why-grid .card:hover{transform:none; border-color:var(--card-border);}
footer{border-top:1px solid var(--card-border); padding:36px 0; margin-top:40px;}
.foot-grid{display:flex; flex-wrap:wrap; gap:30px; justify-content:space-between;}
.foot-col h4{font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:10px;}
.foot-col a{display:block; font-size:.9rem; padding:4px 0; color:var(--text-dim);}
.foot-col a:hover{color:var(--text);}
.foot-bottom{text-align:center; color:var(--text-dim); font-size:.82rem; margin-top:28px;}
.breadcrumb{font-size:.85rem; color:var(--text-dim); margin-bottom:18px;}
.breadcrumb a{color:var(--accent);}
.tool-header h1{font-size:1.7rem; font-weight:800; margin-bottom:6px;}
.tool-header p{color:var(--text-dim); margin-bottom:24px;}
.panel{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:22px; margin-bottom:20px;}
.panel h3{font-size:.95rem; font-weight:700; margin-bottom:12px;}
textarea,input[type=text],input[type=number],select{width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--card-border); background:var(--bg2); font-size:.92rem;}
textarea{min-height:140px; resize:vertical; font-family:ui-monospace,monospace;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:10px 0;}
.btn{padding:10px 18px; border-radius:9px; border:1px solid var(--card-border); background:var(--bg2); cursor:pointer; font-weight:600; font-size:.88rem;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn:hover{filter:brightness(1.08);}
.stat-row{display:flex; gap:20px; flex-wrap:wrap; margin-top:10px;}
.stat{background:var(--bg2); border:1px solid var(--card-border); border-radius:10px; padding:10px 16px; min-width:100px;}
.stat b{display:block; font-size:1.3rem;}
.stat span{font-size:.78rem; color:var(--text-dim);}
.result-box{background:var(--bg2); border:1px dashed var(--card-border); border-radius:10px; padding:14px; font-family:ui-monospace,monospace; font-size:.85rem; word-break:break-all; white-space:pre-wrap; min-height:40px;}
.msg{font-size:.85rem; padding:10px 14px; border-radius:9px; margin-top:10px;}
.msg.err{background:color-mix(in srgb,var(--danger) 15%,transparent); color:var(--danger);}
.msg.ok{background:color-mix(in srgb,var(--success) 15%,transparent); color:var(--success);}
.faq-item{border-bottom:1px solid var(--card-border); padding:14px 0;}
.faq-item h4{font-size:.92rem; margin-bottom:6px;}
.faq-item p{font-size:.86rem; color:var(--text-dim);}
.privacy-note{font-size:.8rem; color:var(--text-dim); background:var(--bg2); border-radius:9px; padding:10px 14px; margin-bottom:20px;}
.legal h2{font-size:1.1rem; margin:20px 0 8px;}
.legal p,.legal li{color:var(--text-dim); font-size:.92rem; line-height:1.6;}
.draft-flag{background:color-mix(in srgb,var(--accent) 15%,transparent); color:var(--accent2); padding:10px 14px; border-radius:9px; font-size:.85rem; margin-bottom:20px;}
@keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@keyframes floatGrad{0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;}}
.fade-in{animation:fadeInUp .45s ease both;}
.fade-in .card{animation:fadeInUp .45s ease both;}
.fade-in .tool-grid .card:nth-child(1),.fade-in .cat-grid .card:nth-child(1){animation-delay:.02s;}
.fade-in .tool-grid .card:nth-child(2),.fade-in .cat-grid .card:nth-child(2){animation-delay:.06s;}
.fade-in .tool-grid .card:nth-child(3),.fade-in .cat-grid .card:nth-child(3){animation-delay:.1s;}
.fade-in .tool-grid .card:nth-child(4),.fade-in .cat-grid .card:nth-child(4){animation-delay:.14s;}
.fade-in .tool-grid .card:nth-child(n+5){animation-delay:.16s;}
.grad-text{background:linear-gradient(100deg,var(--accent),var(--success),var(--accent2),var(--accent)); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:floatGrad 6s ease-in-out infinite;}
.btn.primary{transition:transform .12s,filter .12s;}
.btn.primary:hover{transform:translateY(-1px) scale(1.02);}
.ad-slot{border:1px dashed var(--card-border); border-radius:10px; background:var(--card); color:var(--text-dim); font-size:.75rem; text-align:center; padding:14px; margin:22px 0; letter-spacing:.03em;}
.ad-slot.ad-banner{min-height:90px; display:flex; align-items:center; justify-content:center;}
.ad-slot.ad-square{min-height:250px; max-width:300px; margin-left:auto; margin-right:auto; display:flex; align-items:center; justify-content:center;}
.ad-slot.ad-inline{min-height:60px; display:flex; align-items:center; justify-content:center;}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>

const AD_ENABLED = false; // flip to true and paste your ad network's code into adSlot() once approved — slots render invisible (nothing at all) until then
function adSlot(size,label){
  if(!AD_ENABLED) return ''; // stays completely hidden so visitors never see an empty/broken ad box
  const dims = size==='banner'?'ad-banner':size==='square'?'ad-square':'ad-inline';
  return `<div class="ad-slot ${dims}" data-ad-slot="${label}"><!-- paste ad network code for slot "${label}" here --></div>`;
}

function el(html){const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild;}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function copyText(t){navigator.clipboard.writeText(t).catch(()=>{});}
function download(name,content,type='text/plain'){
  const blob=new Blob([content],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function getUsage(){ try{ return JSON.parse(localStorage.getItem('xtools-usage')||'{}'); }catch(e){ return {}; } }
function trackUsage(id){ try{ const u=getUsage(); u[id]=(u[id]||0)+1; localStorage.setItem('xtools-usage', JSON.stringify(u)); }catch(e){} }
function getPopularTools(n){
  const usage=getUsage();
  return [...TOOLS].sort((a,b)=>{
    const diff=(usage[b.id]||0)-(usage[a.id]||0);
    return diff!==0 ? diff : TOOLS.indexOf(a)-TOOLS.indexOf(b); // fallback: original order until real usage builds up
  }).slice(0,n);
}

}

'color-converter':()=>{
  const t=TOOLS.find(x=>x.id==='color-converter');
  shell(t, `
    <div class="panel"><h3>HEX Input</h3>
      <div class="row"><input type="text" id="col-hex" value="#4f7cff" style="max-width:160px"><input type="color" id="col-pick" value="#4f7cff" style="width:44px;height:38px;padding:2px;"></div>

      </div>
    </div>`,
    [["Which formats are supported?","HEX, RGB and HSL conversions."]]);
  const hexI=document.getElementById('col-hex'), pick=document.getElementById('col-pick');
  function upd(hex){
    hex=hex.trim(); if(!/^#?[0-9a-fA-F]{6}$/.test(hex)){document.getElementById('col-rgb').textContent='invalid';return;}
    if(hex[0]!=='#')hex='#'+hex;
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    document.getElementById('col-rgb').textContent=`rgb(${r}, ${g}, ${b})`;
    let rr=r/255,gg=g/255,bb=b/255,max=Math.max(rr,gg,bb),min=Math.min(rr,gg,bb),h,s,l=(max+min)/2;
    if(max===min){h=s=0;} else {const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){case rr:h=(gg-bb)/d+(gg<bb?6:0);break;case gg:h=(bb-rr)/d+2;break;default:h=(rr-gg)/d+4;}
      h/=6;}
    document.getElementById('col-hsl').textContent=`hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
    pick.value=hex;
  }
  hexI.addEventListener('input',()=>upd(hexI.value));
  pick.addEventListener('input',()=>{hexI.value=pick.value; upd(pick.value);});
  upd(hexI.value);
},

        <input type="number" id="uc-val" value="1" style="max-width:140px">
        <select id="uc-from"></select> → <select id="uc-to"></select>
      </div>
      <div class="result-box" id="uc-out"></div>
    </div>
    <div class="panel"><h3>Temperature</h3>
      <div class="row"><input type="number" id="temp-val" value="0" style="max-width:140px"><select id="temp-from"><option value="c">°C</option><option value="f">°F</option><option value="k">K</option></select></div>
      <div class="result-box" id="temp-out"></div>
    </div>`,
    [["How precise are conversions?","Results are rounded to 4 decimal places using standard conversion factors."]]);
  const typeSel=document.getElementById('uc-type'), fromSel=document.getElementById('uc-from'), toSel=document.getElementById('uc-to');
  function fillUnits(){
    const list=Object.keys(units[typeSel.value]);
    fromSel.innerHTML=toSel.innerHTML=list.map(u=>`<option value="${u}">${u}</option>`).join('');
    toSel.selectedIndex=1;
  }
  function convert(){
    const map=units[typeSel.value], v=parseFloat(document.getElementById('uc-val').value)||0;
    const base=v*map[fromSel.value], res=base/map[toSel.value];
    document.getElementById('uc-out').textContent=`${v} ${fromSel.value} = ${res.toFixed(4)} ${toSel.value}`;
  }
  [typeSel,fromSel,toSel,document.getElementById('uc-val')].forEach(elm=>elm.addEventListener('input',()=>{ if(elm===typeSel) fillUnits(); convert();}));
  fillUnits(); convert();
  function tempConvert(){
    const v=parseFloat(document.getElementById('temp-val').value)||0, from=document.getElementById('temp-from').value;
    let c = from==='c'?v:from==='f'?(v-32)*5/9:v-273.15;
    document.getElementById('temp-out').textContent=`${c.toFixed(2)}°C = ${(c*9/5+32).toFixed(2)}°F = ${(c+273.15).toFixed(2)}K`;
  }
  document.getElementById('temp-val').addEventListener('input',tempConvert);
  document.getElementById('temp-from').addEventListener('input',tempConvert);
  tempConvert();
},

      <p style="font-size:.8rem;color:var(--text-dim);margin-top:8px">Images are added to the PDF in the order selected.</p>

      <div class="row"><button class="btn primary" id="j2p-dl">Download PDF</button></div>
    </div>`,
    [["Is there a page limit?","No hard limit, but very large or many images will take longer to process in your browser."]]);
  let files=[], pdfBlob=null;
  document.getElementById('j2p-file').addEventListener('change',e=>{ files=[...e.target.files]; document.getElementById('j2p-run').disabled=!files.length; });
  document.getElementById('j2p-run').addEventListener('click',async()=>{
    const msg=document.getElementById('j2p-msg'); msg.innerHTML='<div class="msg ok">Building PDF…</div>';
    try{
      const {jsPDF}=window.jspdf; let doc=null;
      for(const f of files){
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
        const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl;});

        else doc.addPage([img.width,img.height],orient);

      }

      document.getElementById('j2p-result').style.display='block';
    }catch(err){ msg.innerHTML='<div class="msg err">Could not build PDF from these files.</div>'; }

'lorem-ipsum':()=>{
  const t=TOOLS.find(x=>x.id==='lorem-ipsum');
  const words='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat'.split(' ');
  shell(t, `<div class="panel"><h3>Options</h3>
    <div class="row"><select id="li-type"><option value="p">Paragraphs</option><option value="s">Sentences</option><option value="w">Words</option></select>
    <input type="number" id="li-count" value="3" min="1" max="50" style="width:80px"><button class="btn primary" id="li-run">Generate</button></div></div>
    <div class="panel"><h3>Result</h3><div class="result-box" id="li-out"></div><div class="row"><button class="btn" id="li-copy">Copy</button></div></div>`,
    [["Is the text always the same?","Words are drawn randomly from classic lorem ipsum vocabulary, so each generation is different."]]);
  function sentence(){ const n=5+Math.floor(Math.random()*8); const w=Array.from({length:n},()=>words[Math.floor(Math.random()*words.length)]); w[0]=w[0][0].toUpperCase()+w[0].slice(1); return w.join(' ')+'.'; }
  document.getElementById('li-run').addEventListener('click',()=>{
    const type=document.getElementById('li-type').value, n=Math.max(1,Math.min(50,parseInt(document.getElementById('li-count').value)||1));
    let out;
    if(type==='w') out=Array.from({length:n},()=>words[Math.floor(Math.random()*words.length)]).join(' ');
    else if(type==='s') out=Array.from({length:n},sentence).join(' ');
    else out=Array.from({length:n},()=>Array.from({length:4+Math.floor(Math.random()*3)},sentence).join(' ')).join('\n\n');
    document.getElementById('li-out').textContent=out;
  });
  document.getElementById('li-copy').addEventListener('click',()=>copyText(document.getElementById('li-out').textContent));
},

'hash-generator':()=>{
  const t=TOOLS.find(x=>x.id==='hash-generator');
  shell(t, `<div class="panel"><h3>Input</h3><textarea id="hg-in" placeholder="Type text to hash..."></textarea>
    <div class="row"><select id="hg-algo"><option value="SHA-256">SHA-256</option><option value="SHA-1">SHA-1</option><option value="SHA-512">SHA-512</option></select>
    <button class="btn primary" id="hg-run">Generate Hash</button></div></div>
    <div class="panel"><h3>Result</h3><div class="result-box" id="hg-out"></div><div class="row"><button class="btn" id="hg-copy">Copy</button></div></div>`,
    [["Is this secure enough for passwords?","These are standard cryptographic hashes computed via the browser's Web Crypto API — fine for checksums, not a substitute for a proper password-hashing scheme with salting."]]);
  document.getElementById('hg-run').addEventListener('click',async()=>{
    const v=document.getElementById('hg-in').value, algo=document.getElementById('hg-algo').value;
    const buf=await crypto.subtle.digest(algo, new TextEncoder().encode(v));
    document.getElementById('hg-out').textContent=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  });
  document.getElementById('hg-copy').addEventListener('click',()=>copyText(document.getElementById('hg-out').textContent));
},

'emi-calculator':()=>{
  const t=TOOLS.find(x=>x.id==='emi-calculator');
  shell(t, `<div class="panel"><h3>Loan Details</h3>
    <div class="row"><input type="number" id="emi-p" placeholder="Loan amount" style="max-width:160px"><input type="number" id="emi-r" placeholder="Annual interest %" style="max-width:170px"><input type="number" id="emi-n" placeholder="Tenure (months)" style="max-width:170px"><button class="btn primary" id="emi-run">Calculate</button></div>
    <div class="stat-row" id="emi-out"></div></div>`,
    [["What formula is used?","The standard reducing-balance EMI formula: EMI = P×r×(1+r)^n / ((1+r)^n − 1), where r is the monthly interest rate."]]);
  document.getElementById('emi-run').addEventListener('click',()=>{
    const p=parseFloat(document.getElementById('emi-p').value), annR=parseFloat(document.getElementById('emi-r').value), n=parseInt(document.getElementById('emi-n').value), box=document.getElementById('emi-out');
    if(isNaN(p)||isNaN(annR)||!n){box.innerHTML='<div class="msg err">Enter valid numbers.</div>';return;}
    const r=annR/12/100, emi = r===0 ? p/n : p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    box.innerHTML=`<div class="stat"><b>${emi.toFixed(2)}</b><span>Monthly EMI</span></div><div class="stat"><b>${(emi*n-p).toFixed(2)}</b><span>Total interest</span></div><div class="stat"><b>${(emi*n).toFixed(2)}</b><span>Total payment</span></div>`;
  });
},
'date-difference':()=>{
  const t=TOOLS.find(x=>x.id==='date-difference');
  shell(t, `<div class="panel"><h3>Two Dates</h3>
    <div class="row"><input type="date" id="dd-a"><input type="date" id="dd-b"><button class="btn primary" id="dd-run">Calculate</button></div>
    <div class="stat-row" id="dd-out"></div></div>`,
    [["Does it count leap years?","Yes — the difference is computed from real calendar dates, so leap years are handled automatically."]]);
  document.getElementById('dd-run').addEventListener('click',()=>{
    const a=new Date(document.getElementById('dd-a').value), b=new Date(document.getElementById('dd-b').value), box=document.getElementById('dd-out');
    if(isNaN(a)||isNaN(b)){box.innerHTML='<div class="msg err">Pick two valid dates.</div>';return;}
    const days=Math.round(Math.abs(b-a)/86400000);
    box.innerHTML=`<div class="stat"><b>${days}</b><span>Days</span></div><div class="stat"><b>${(days/7).toFixed(1)}</b><span>Weeks</span></div><div class="stat"><b>${(days/365.25).toFixed(2)}</b><span>Years</span></div>`;
  });
},
'random-number':()=>{
  const t=TOOLS.find(x=>x.id==='random-number');
  shell(t, `<div class="panel"><h3>Range</h3>
    <div class="row"><input type="number" id="rn-min" value="1" style="max-width:100px"><input type="number" id="rn-max" value="100" style="max-width:100px"><input type="number" id="rn-count" value="1" min="1" max="100" style="max-width:100px"><button class="btn primary" id="rn-run">Generate</button></div>
    <div class="result-box" id="rn-out"></div></div>`,
    [["Is this truly random?","It uses the browser's cryptographically secure random number generator."]]);
  document.getElementById('rn-run').addEventListener('click',()=>{
    const min=parseInt(document.getElementById('rn-min').value), max=parseInt(document.getElementById('rn-max').value), n=Math.max(1,Math.min(100,parseInt(document.getElementById('rn-count').value)||1)), box=document.getElementById('rn-out');
    if(isNaN(min)||isNaN(max)||min>=max){box.innerHTML='Enter a valid range.';return;}
    const arr=new Uint32Array(n); crypto.getRandomValues(arr);

  });

'random-string':()=>{
  const t=TOOLS.find(x=>x.id==='random-string');
  shell(t, `<div class="panel"><h3>Options</h3>
    <div class="row"><label>Length: <input type="number" id="rs-len" value="12" min="1" max="128" style="width:80px"></label>
    <label><input type="checkbox" id="rs-num" checked> Numbers</label><label><input type="checkbox" id="rs-sym"> Symbols</label>
    <button class="btn primary" id="rs-run">Generate</button></div>
    <div class="result-box" id="rs-out"></div><div class="row"><button class="btn" id="rs-copy">Copy</button></div></div>`,
    [["Can I use this as a password?","You can, but the Password Generator tool offers more targeted character-type controls for that purpose."]]);
  document.getElementById('rs-run').addEventListener('click',()=>{
    const len=Math.max(1,Math.min(128,parseInt(document.getElementById('rs-len').value)||12));
    let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    if(document.getElementById('rs-num').checked) chars+='0123456789';
    if(document.getElementById('rs-sym').checked) chars+='!@#$%^&*-_=+';
    const arr=new Uint32Array(len); crypto.getRandomValues(arr);
    document.getElementById('rs-out').textContent=Array.from(arr,n=>chars[n%chars.length]).join('');
  });
  document.getElementById('rs-copy').addEventListener('click',()=>copyText(document.getElementById('rs-out').textContent));
},

function setSEO(title, desc){
  document.title = title;
  document.querySelector('meta[name="description"]').setAttribute('content', desc);
  document.getElementById('ogTitle').setAttribute('content', title);
  document.getElementById('ogDesc').setAttribute('content', desc);
  document.getElementById('twTitle').setAttribute('content', title);
  document.getElementById('twDesc').setAttribute('content', desc);
  document.getElementById('canonicalLink').setAttribute('href', 'https://xtools.example/'+location.hash.replace(/^#\//,''));
}
document.getElementById('footerAd').innerHTML = adSlot('banner','footer');
function router(){
  const hash = location.hash.replace(/^#/,'') || '/';
  const path = hash.split('?')[0];
  document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+path));
  document.getElementById('navLinks').classList.remove('open');
  window.scrollTo(0,0);
  const app=document.getElementById('app');
  if(path==='/' ){ renderHome(); document.getElementById('dynamicLD').textContent=''; setSEO('X Tools — Simple, Fast & Powerful Online Tools','Free browser-based tools for text, developer, image, PDF, QR and calculator tasks. Fast, private, no sign-up.'); }
  else if(path==='/tools'){ renderToolsList(); document.getElementById('dynamicLD').textContent=''; setSEO('All Tools — X Tools','Browse every free online tool on X Tools, organized by category.'); }
  else if(path.startsWith('/tool/')){
    const id=path.split('/')[2]; const tl=TOOLS.find(x=>x.id===id);
    renderTool(id);
    if(tl) trackUsage(id);
    setSEO(tl? `${tl.name} — Free Online Tool | X Tools` : 'Tool not found | X Tools', tl? tl.desc : 'This tool does not exist.');
  }
  else if(staticPages[path.slice(1)]){ app.innerHTML = staticPages[path.slice(1)]; document.getElementById('dynamicLD').textContent=''; setSEO(path.slice(1).replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+' | X Tools','X Tools policy and information page.'); }
  else { app.innerHTML = '<h1>404 — Page not found</h1><p><a href="#/">Go home</a></p>'; document.getElementById('dynamicLD').textContent=''; setSEO('Page not found | X Tools','The page you are looking for does not exist.'); }
  app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in');
}
window.addEventListener('hashchange', router);

document.getElementById('hamburger').addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('open'));
const themeBtn=document.getElementById('themeToggle');
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  themeBtn.textContent = mode==='light' ? '☀️' : '🌙';
  try{localStorage.setItem('xtools-theme', mode);}catch(e){}
}
let saved; try{saved=localStorage.getItem('xtools-theme');}catch(e){}
applyTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark'));
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'));

router();
